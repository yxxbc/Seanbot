[workspace]
resolver = "3"
members = ["crates/seanbot-provider", "crates/seanbot-core", "crates/seanbot-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
seanbot-provider = { path = "crates/seanbot-provider" }
seanbot-core = { path = "crates/seanbot-core" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
# scrolling-regions：行内视口的 insert_before 走"滚动区域"而不是清屏重绘
ratatui = { version = "0.29", features = ["scrolling-regions"] }
theway-markdown = "0.1"
tui-textarea = "0.7"
flate2 = "1"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rpassword = "7"
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
similar = "2"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"
insta = "1"
tempfile = "3"
wiremock = "0.6"
