name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！

        提交前请先**搜索现有 Issue**；也请留意项目的 MVP 范围——
        知识库、人格、子代理、插件等功能已在长期规划中，相近的建议会被合并处理。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，未发现相同建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 痛点
      description: 你在什么场景下遇到了什么不便？
      placeholder: 当我在……时，我希望……，但目前……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 Seanbot 如何表现？越具体越好（涉及的命令、交互、输出示例等）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过哪些变通做法？为什么不够好？

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - CLI / 交互体验
        - 内核（agent 主循环 / 事件）
        - 厂商层（模型接入）
        - 工具（bash / read / edit / search）
        - 知识库
        - 人格
        - 子代理
        - 插件系统
        - 文档 / 其他
    validations:
      required: true

  - type: dropdown
    id: willing
    attributes:
      label: 是否愿意提交 PR 实现该功能
      options:
        - 愿意，我可以自己实现
        - 愿意，但需要一些指导
        - 暂时不，仅提出建议
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 草图、参考实现（其他工具的类似功能）、相关链接等
