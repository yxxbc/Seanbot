name: 🐛 报告问题（普通用户）
description: 使用中遇到问题？用大白话告诉我们发生了什么就行
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 遇到问题了？别着急，我们一起看看 💪

        填这张表**不需要懂技术**，用日常说话的方式描述就行。有些内容不知道怎么填，能填多少填多少。

        > ⚠️ **请不要粘贴你的 API key**（通常是以 `sk-` 开头的一长串字符）——它是你的私密凭证，贴出来可能被人盗用。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前的小确认
      options:
        - label: 我看过已有问题列表，没有找到和我一样的情况
          required: true

  - type: textarea
    id: what_happened
    attributes:
      label: 遇到了什么问题？
      description: 用自己的话描述就好，越具体越有帮助
      placeholder: |
        例如：我让它帮我改一个文件，它说改好了，
        但我打开文件发现内容根本没变。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 你当时是怎么操作的？
      description: 按「第一步、第二步……」的顺序写，就像讲给别人听你刚才做了什么
      placeholder: |
        1. 打开终端，输入 sean 回车
        2. 我打了这样一句话：……
        3. 然后它就……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你原本希望它怎么做？
      placeholder: 我以为它会……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 它实际做了什么？
      placeholder: 但实际上它……
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 这个问题多久出现一次？
      options:
        - 每次都会
        - 有时会，有时不会
        - 只遇到过一次
        - 不太确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 你用的 Seanbot 版本（不知道可以不填）
      description: 打开终端运行 `sean --version`，把结果粘贴过来；或者回忆一下你从哪里下载的
      placeholder: 例如 0.1.0

  - type: dropdown
    id: os
    attributes:
      label: 你用的是什么电脑？
      options:
        - Mac（苹果电脑）
        - Linux 电脑
        - 不太确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充说明（可选）
      description: 可以直接把截图拖进这个框；其他想补充的内容也写在这里
