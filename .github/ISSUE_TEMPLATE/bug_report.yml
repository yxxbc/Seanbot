name: Bug 报告
description: 报告一个缺陷，帮助我们改进 Seanbot
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！

        提交前请先**搜索现有 Issue** 确认没有重复，并尽量使用**最新版本**复现。
        请**隐去所有 API key**（`sk-...`），不要粘贴 `~/.seanbot/config.toml` 的原文。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，未发现相同问题
          required: true
        - label: 我已使用最新版本复现（`git pull` 后重新构建，或最新发布版本）
          required: true
        - label: 我已隐去日志与配置中的 API key 等敏感信息
          required: true

  - type: input
    id: version
    attributes:
      label: Seanbot 版本
      description: 运行 `sean --version`；若该命令不可用，请提供当前构建的提交哈希（`git rev-parse --short HEAD`）
      placeholder: 例如 0.1.0 或 0706d47
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Linux
        - 其他（请在"补充信息"中说明）
    validations:
      required: true

  - type: input
    id: rust
    attributes:
      label: Rust 版本（从源码构建时填写）
      description: 运行 `rustc --version`，请与编译时使用的版本一致
      placeholder: 例如 rustc 1.85.0

  - type: dropdown
    id: provider
    attributes:
      label: 模型厂商 / 模型
      options:
        - DeepSeek 官方 API
        - 其他 OpenAI 兼容厂商（请在"补充信息"中说明）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、完整、可重复的操作步骤
      placeholder: |
        1. 运行 `sean`
        2. 输入「……」
        3. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际发生了什么？如有报错请完整粘贴。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错输出
      description: 完整输出优先；粘贴前请再次确认已隐去 API key
      render: shell

  - type: dropdown
    id: reproducible
    attributes:
      label: 复现频率
      options:
        - 每次必现
        - 偶尔出现（不稳定）
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、相关配置（隐去密钥）、是否只在特定项目 / 目录出现、是否与特定模型相关等
