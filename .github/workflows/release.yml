name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: 核对版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 标签与 Cargo.toml 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bash scripts/cargo-version.sh)"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 Cargo.toml 版本 ${version} 不一致"
            exit 1
          fi

  build:
    name: 构建（${{ matrix.target }}）
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 编译
        run: cargo build --release --locked -p seanbot-cli --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: scripts/package.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: sean-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: |
          cd dist
          sha256sum sean-* > SHA256SUMS
          cat SHA256SUMS
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          [ -s notes.md ] || echo "见 CHANGELOG.md" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Seanbot ${GITHUB_REF_NAME}" \
            --notes-file notes.md
